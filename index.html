<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>近两小时下雨吗 · 实时</title>
<meta name="theme-color" content="#1c2540">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; background: linear-gradient(180deg,#1c2540 0%,#2a3a5c 100%); color:#eef2fa; min-height:100vh; padding:24px 16px 40px; padding-top:calc(24px + env(safe-area-inset-top)); padding-bottom:calc(40px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 640px; margin: 0 auto; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  h1 { font-size:20px; font-weight:600; }
  .meta { font-size:12px; color:#9fb0cc; }
  .card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:20px; margin-top:14px; }
  .place { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .place b { font-size:17px; }
  #searchBox { display:none; gap:6px; margin-top:10px; }
  #searchBox input { flex:1; min-width:160px; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,.25); background:rgba(0,0,0,.25); color:#fff; font-size:16px; }
  button { padding:11px 16px; min-height:44px; border-radius:10px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.12); color:#fff; font-size:14px; cursor:pointer; }
  button:hover { background:rgba(255,255,255,.22); }
  .results { margin-top:6px; font-size:14px; }
  .results div { padding:10px 8px; border-radius:6px; cursor:pointer; }
  .results div:hover { background:rgba(255,255,255,.12); }
  .verdict { text-align:center; padding:18px 8px 8px; }
  .verdict .emoji { font-size:56px; }
  .verdict .main { font-size:26px; font-weight:700; margin-top:8px; }
  .verdict .sub { font-size:14px; color:#b8c6e0; margin-top:6px; }
  .chart { display:flex; gap:6px; align-items:flex-end; height:130px; margin-top:18px; }
  .bar { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; }
  .bar .col { width:100%; border-radius:6px 6px 0 0; background:linear-gradient(180deg,#6db3f2,#3d7dca); min-height:3px; }
  .bar.dry .col { background:#3a4a6d; min-height:3px; }
  .bar .t { font-size:11px; color:#9fb0cc; margin-top:6px; }
  .bar .v { font-size:10px; color:#b8c6e0; margin-bottom:3px; }
  .prob { display:flex; gap:6px; margin-top:4px; }
  .prob div { flex:1; text-align:center; font-size:11px; color:#8fd3a8; }
  .note { font-size:12px; color:#9fb0cc; margin-top:14px; line-height:1.7; }
  .banner { display:none; margin-top:12px; padding:8px 12px; border-radius:8px; background:#5a3b1e; color:#ffd9a0; font-size:13px; }
  .foot { text-align:center; margin-top:18px; font-size:12px; color:#9fb0cc; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🌧️ 近两小时下雨吗</h1>
    <div class="meta">数据截至 <span id="ts">--:--:--</span></div>
  </div>

  <div class="card">
    <div class="place">
      <b id="placeName">定位中…</b>
      <button onclick="locate()">📍定位</button>
      <button onclick="toggleSearch()">换城市</button>
      <button onclick="load()">刷新</button>
    </div>
    <div id="searchBox">
      <input id="q" placeholder="城市 / 区县 / 地标 / 具体地址，如：上海市闵行区 · 人民广场 · 南京东路" onkeydown="if(event.key==='Enter')search()">
      <button onclick="search()">搜索</button>
      <div class="results" id="results"></div>
    </div>

    <div class="verdict">
      <div class="emoji" id="vEmoji">⏳</div>
      <div class="main" id="vMain">正在获取当前时刻的降水预报…</div>
      <div class="sub" id="vSub"></div>
    </div>
    <div class="chart" id="chart"></div>
    <div class="prob" id="prob"></div>
    <div class="banner" id="banner"></div>
    <div class="note">
      主源 Open-Meteo（15 分钟级，免 key）· 备源 met.no（小时级）· 每 5 分钟自动刷新。<br>
      每次打开与刷新都重新拉取，"数据截至"即拉取时刻；判据：15 分钟格降水 ≥ 0.1mm 记为有雨。
    </div>
  </div>
  <div class="foot">📲 iPhone：Safari 打开后点"分享 → 添加到主屏幕"，即可当小应用使用</div>
</div>

<script>
const KEY='rain2h.loc', DEFAULT={name:'北京',lat:39.9075,lon:116.39723};
let loc=null;
function saveLoc(l){loc=l;localStorage.setItem(KEY,JSON.stringify(l));}
function toggleSearch(){const b=document.getElementById('searchBox');b.style.display=b.style.display==='flex'?'none':'flex';}
async function search(){
  const q=document.getElementById('q').value.trim(); if(!q)return;
  const box=document.getElementById('results'); box.textContent='搜索中…';
  // 双源并行：Open-Meteo geocoding（城市级）+ Photon/OSM（区县/地标/街道/具体地址），合并去重
  const [om,ph]=await Promise.allSettled([
    fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=zh`).then(r=>r.json()),
    fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6`).then(r=>r.json())
  ]);
  let items=[];
  if(om.status==='fulfilled'&&(om.value.results||[]).length)
    items=om.value.results.map(c=>({label:`${c.name}${c.admin1?' · '+c.admin1:''}${c.country?' · '+c.country:''}`,name:c.name,city:c.admin1||c.name,lat:c.latitude,lon:c.longitude}));
  if(ph.status==='fulfilled'&&(ph.value.features||[]).length)
    ph.value.features.forEach(f=>{const p=f.properties,g=f.geometry.coordinates;
      items.push({label:`${p.name}${p.city&&p.city!==p.name?' · '+p.city:''}${p.state?' · '+p.state:''}${p.country?' · '+p.country:''}`,name:p.name,city:p.city||p.name,lat:g[1],lon:g[0]});});
  const seen=[];
  items=items.filter(it=>{ // 坐标 0.05° 内视为重复
    if(seen.some(s=>Math.abs(s.lat-it.lat)<0.05&&Math.abs(s.lon-it.lon)<0.05))return false;
    seen.push(it);return true;
  }).slice(0,10);
  box.innerHTML='';
  items.forEach(it=>{
    const d=document.createElement('div'); d.textContent=it.label;
    d.onclick=()=>{saveLoc({name:it.city&&it.city!==it.name?it.name+' · '+it.city:it.name,lat:it.lat,lon:it.lon,source:'manual'});box.innerHTML='';document.getElementById('searchBox').style.display='none';load();};
    box.appendChild(d);
  });
  if(!box.children.length)box.textContent='没有找到，换个名字试试（如"闵行区""人民广场""南京东路"）';
}
async function reverseName(lat,lon){ // 反查地名：坐标 → 区县/城市
  try{
    const j=await (await fetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}`)).json();
    const p=j.features&&j.features[0]&&j.features[0].properties;
    if(!p)return null;
    const main=p.district||p.city||p.name, second=(p.city&&p.city!==main)?p.city:(p.state&&p.state!==main?p.state:null);
    return second?main+' · '+second:main;
  }catch(e){return null;}
}
async function ipLocate(){ // IP 兜底定位（城市级）：仅当机器定位（GPS/系统定位）失败时使用
  try{const j=await (await fetch('https://ipwho.is/')).json();
    if(j&&j.success!==false&&isFinite(j.latitude))return {lat:+j.latitude.toFixed(4),lon:+j.longitude.toFixed(4)};}catch(e){}
  return null;
}
let holdBanner=null; // locate 设、load 显示后清空
async function locate(){ // 📍按钮 & 每次打开共用：①机器自带定位（GPS/系统定位）②IP 兜底 ③默认北京
  document.getElementById('placeName').textContent='定位中…';
  let lat=null,lon=null,how='';
  try{
    const p=await new Promise((res,rej)=>{if(!navigator.geolocation)rej(new Error('no-geolocation'));navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000,maximumAge:300000,enableHighAccuracy:true});});
    lat=+p.coords.latitude.toFixed(4);lon=+p.coords.longitude.toFixed(4);how='gps';
  }catch(e){}
  if(lat==null){const ip=await ipLocate(); if(ip){lat=ip.lat;lon=ip.lon;how='ip';}}
  if(lat!=null){
    const name=(await reverseName(lat,lon))||'我的位置';
    saveLoc({name,lat,lon,source:'auto'});
    if(how==='ip')holdBanner='⚠️ 机器定位不可用（未授权或系统定位关闭），已用 IP 兜底定位（仅城市级）。允许定位权限后点「📍定位」可精确定位。';
  }else{
    saveLoc({...DEFAULT,source:'auto'});
    holdBanner='⚠️ 定位失败：请允许浏览器的定位权限（系统设置的位置服务也需开启）。当前显示默认城市，可点「换城市」手动选。';
  }
  load();
}
function fmt(t){const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function render(slots,src){
  const now=Date.now();
  document.getElementById('ts').textContent=new Date().toLocaleTimeString('zh-CN');
  const rainy=slots.filter(s=>s.p>=0.1);
  const e=document.getElementById('vEmoji'),m=document.getElementById('vMain'),s=document.getElementById('vSub');
  if(rainy.length){
    const first=rainy[0], mins=Math.max(0,Math.round((first.t-now)/60000/5)*5);
    const dur=rainy.length*15;
    e.textContent='🌧️';
    m.textContent=mins<=7?'正在下雨':'约 '+mins+' 分钟后开始下雨';
    s.textContent='预计持续约 '+dur+' 分钟（未来两小时内 '+rainy.length+'/8 个时段有降水）· 来源：'+src;
  }else{
    e.textContent='🌤️';
    m.textContent='未来两小时无降水迹象';
    const maxProb=Math.max(...slots.map(x=>x.pr!=null?x.pr:0),0);
    s.textContent=(maxProb>=30?'降水概率最高 '+maxProb+'%，建议留意更新':'降水概率低（最高 '+maxProb+'%）')+' · 来源：'+src;
  }
  const mx=Math.max(...slots.map(x=>x.p),0.1);
  const ch=document.getElementById('chart'),pr=document.getElementById('prob');ch.innerHTML='';pr.innerHTML='';
  slots.forEach(x=>{
    const b=document.createElement('div');b.className='bar'+(x.p<0.1?' dry':'');
    const v=document.createElement('div');v.className='v';v.textContent=x.p>0?x.p.toFixed(1):'';
    const c=document.createElement('div');c.className='col';c.style.height=Math.max(4,x.p/mx*100)+'%';
    const t=document.createElement('div');t.className='t';t.textContent=fmt(x.t);
    b.append(v,c,t);ch.appendChild(b);
    const p=document.createElement('div');p.textContent=x.pr!=null?x.pr+'%':'—';pr.appendChild(p);
  });
}
async function load(){
  if(!loc){
    let saved=null; try{saved=JSON.parse(localStorage.getItem(KEY));}catch(e){}
    if(saved&&saved.source==='manual'){loc=saved;} // 手动选的城市尊重用户，不自动改
    else{await locate();return;} // 自动定位来的位置（或无记录）：每次打开都重新定位，跟着人走
  }
  document.getElementById('placeName').textContent=loc.name;
  document.getElementById('vMain').textContent='正在获取当前时刻的降水预报…';
  const b0=document.getElementById('banner');
  if(holdBanner){b0.textContent=holdBanner;b0.style.display='block';holdBanner=null;} // 显示定位提示（IP 兜底/失败）
  else b0.style.display='none';
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&minutely_15=precipitation,precipitation_probability&forecast_days=1&timezone=auto`;
    const j=await (await fetch(u)).json();
    const now=Date.now();
    const slots=(j.minutely_15.time||[]).map((t,i)=>({t:new Date(t).getTime(),p:+(j.minutely_15.precipitation||[])[i]||0,pr:(j.minutely_15.precipitation_probability||[])[i]}))
      .filter(x=>x.t>=now-15*60000).slice(0,8);
    if(!slots.length)throw new Error('主源无 minutely_15 数据');
    render(slots,'Open-Meteo · 15分钟级');
  }catch(e1){
    try{
      const u=`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${(+loc.lat).toFixed(2)}&lon=${(+loc.lon).toFixed(2)}`;
      const j=await (await fetch(u)).json();
      const now=Date.now();
      const slots=j.properties.timeseries.filter(x=>new Date(x.time).getTime()>=now-3600e3).slice(0,2)
        .map(x=>({t:new Date(x.time).getTime(),p:+(x.data.instant.details.precipitation_amount||0),pr:null}));
      while(slots.length<2)slots.push({t:now+(slots.length+1)*3600e3,p:0,pr:null});
      render(slots,'met.no · 小时级');
      const b=document.getElementById('banner');b.style.display='block';
      b.textContent='⚠️ 主源不可用，已切换备源 met.no（仅小时级粒度）';
    }catch(e2){
      document.getElementById('vEmoji').textContent='⚠️';
      document.getElementById('vMain').textContent='数据源暂时都不可达';
      document.getElementById('vSub').textContent='请稍后点"刷新"重试';
    }
  }
}
load();
setInterval(load,5*60*1000);
</script>
</body>
</html>
